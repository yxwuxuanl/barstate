name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            dmg_name: BarState-macos-arm64.dmg
            artifact_name: barstate-dmg-arm64
          - arch: x86_64
            runner: macos-15-intel
            dmg_name: BarState-macos-x86_64.dmg
            artifact_name: barstate-dmg-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift package tests
        run: swift test

      - name: Check localizations
        run: ./scripts/check-localizations.sh

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Run app smoke tests
        run: ./scripts/test-app-smoke.sh

      - name: Verify app architecture
        run: |
          binaries=(
            ".build/BarState.app/Contents/MacOS/BarState"
            ".build/BarState.app/Contents/XPCServices/com.barstate.BarState.ScriptService.xpc/Contents/MacOS/BarStateScriptService"
          )
          for binary in "${binaries[@]}"; do
            actual_arch="$(lipo -archs "$binary")"
            if [[ "$actual_arch" != "${{ matrix.arch }}" ]]; then
              echo "Expected $binary to be ${{ matrix.arch }}, got $actual_arch"
              exit 1
            fi
          done

      - name: Package DMG
        run: |
          staging_dir=".build/dmg"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp -R .build/BarState.app "$staging_dir/"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create \
            -volname BarState \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            ".build/${{ matrix.dmg_name }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: .build/${{ matrix.dmg_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Apple Silicon DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: barstate-dmg-arm64
          path: release

      - name: Download Intel DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: barstate-dmg-x86_64
          path: release

      - name: Create release and upload DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          dmg_assets=(
            "release/BarState-macos-arm64.dmg#BarState for Apple Silicon (arm64)"
            "release/BarState-macos-x86_64.dmg#BarState for Intel Macs (x86_64)"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$GITHUB_REF_NAME" \
              --json assets \
              --jq '.assets[].name')"
            for dmg_asset in "${dmg_assets[@]}"; do
              dmg_path="${dmg_asset%%#*}"
              dmg_name="$(basename "$dmg_path")"
              if grep -Fxq "$dmg_name" <<< "$existing_assets"; then
                echo "$dmg_name is already attached to $GITHUB_REF_NAME"
              else
                gh release upload "$GITHUB_REF_NAME" "$dmg_asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" \
              "${dmg_assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "BarState $GITHUB_REF_NAME"
          fi
